name: Link official project page once
on:
  push:
    paths: [".github/workflows/link-official-project-page-once.yml"]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add first-party project reference
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          url = 'https://matinshahabadi.ir/projects/discord-quest-auto-completer/'
          if url not in text:
              marker = '<!-- repo-badges:end -->'
              line = '\n\n> **Official project page:** [matinshahabadi.ir/projects/discord-quest-auto-completer/](https://matinshahabadi.ir/projects/discord-quest-auto-completer/)'
              text = text.replace(marker, marker + line, 1) if marker in text else line.lstrip() + '\n\n' + text
              p.write_text(text, encoding='utf-8')
          PY
      - name: Commit and remove one-shot workflow
        run: |
          git config user.name "Matin Shahabadi"
          git config user.email "116592301+power0matin@users.noreply.github.com"
          git rm -f .github/workflows/link-official-project-page-once.yml
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: link official QuestMaster project page"
          git push