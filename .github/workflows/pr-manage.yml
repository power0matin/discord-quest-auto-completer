name: Pull Request Management

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  manage-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Process Pull Request
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const action = context.payload.action;

            console.log(`PR ${action}: ${pr.title}`);
            console.log(`Number: ${pr.number}`);
            console.log(`Files changed: ${pr.changed_files}`);
            console.log(`Additions: ${pr.additions}`);
            console.log(`Deletions: ${pr.deletions}`);

            const labels = [];
            const title = pr.title.toLowerCase();

            if (title.includes('bug')) labels.push('bug');
            if (title.includes('feature')) labels.push('enhancement');
            if (title.includes('documentation')) labels.push('documentation');
            if (title.includes('refactor')) labels.push('refactoring');

            if (labels.length > 0) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  labels,
                });
                console.log(`Added labels: ${labels.join(', ')}`);
              } catch (error) {
                core.warning(`Could not add PR labels: ${error.message}`);
              }
            }

            if (action === 'opened') {
              try {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body: `Thank you for contributing to the Discord Quest Auto Completer!

            Please make sure your PR:

            1. **Follows the code style** of the project
            2. **Includes tests** if applicable
            3. **Updates documentation** if needed
            4. **Has a clear description** of the changes

            ### Checklist

            - [ ] Code follows the style guidelines
            - [ ] Self-review completed
            - [ ] Comments added for complex logic
            - [ ] Documentation updated
            - [ ] Tests added/updated
            - [ ] All tests pass

            Thank you for helping improve the project!`,
                });
              } catch (error) {
                core.warning(`Could not add welcome comment: ${error.message}`);
              }
            }

            if (action === 'synchronize') {
              const files = await github.rest.pulls.listFiles({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
              });
              console.log(`Files in PR: ${files.data.map(f => f.filename).join(', ')}`);
            }
