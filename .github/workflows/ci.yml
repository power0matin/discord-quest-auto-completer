name: CI

on:
  push:
    branches: [ main, agent/v1.1.0-runtime-reliability ]
  pull_request:
    branches: [ main ]

jobs:
  reliability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check quest_completer.js
      - name: Run runtime reliability fault-injection tests
        run: node tests/reliability.test.js
      - name: Validate markdown files exist and are non-empty
        run: |
          set -e
          for file in *.md; do
            if [ -f "$file" ]; then
              echo "Checking $file..."
              test -s "$file"
            fi
          done

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required repository files
        run: |
          set -e
          test -f quest_completer.js
          test -f tests/reliability.test.js
          test -f README.md
          test -f README.fa.md
          test -f LICENSE
          test -f SECURITY.md
          test -f CHANGELOG.md
